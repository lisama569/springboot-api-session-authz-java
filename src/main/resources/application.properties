# 随机端口（0）便于本地并行启动；需要固定端口可改为 8080
server.port=0

# 会话凭证默认存活时长（秒），签发/续期时也可按请求覆盖；上限固定 86400 秒
authz.session.ttl-seconds=300

# 鉴权判定日志（调用方/动作/凭证状态/策略版本/判定结果）
logging.level.com.github.lisama569.springbootapisessionauthzjava.authz=INFO
logging.level.com.github.lisama569.springbootapisessionauthzjava.tests=INFO
